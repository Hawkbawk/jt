version: "2"

linters:
  enable:
    - depguard
    - errorlint
    - misspell
    - modernize
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        popup:
          files:
            - "**/internal/tui/popup/**"
          deny:
            - pkg: github.com/hawkbawk/jt
              desc: popup is a standalone bubble, so it can't depend on the rest of jt
    govet:
      # Same analyzers gopls runs by default (plus a few extras), minus the
      # noisy opt-in ones.
      enable-all: true
      disable:
        - fieldalignment
        - shadow

formatters:
  enable:
    - gofumpt
    - goimports
